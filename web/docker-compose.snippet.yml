# Add this service to the same compose file as lyrion-app.
# It shares Lyrion's music volume (read-only) and playlist folder, so paths match 1:1.
  rpm-playlists:
    image: 'ghcr.io/tabnul/rpm-mp3-playlist-generator:latest'
    # or build locally instead:  build: ./rpm-mp3-playlist-generator/web
    restart: unless-stopped
    user: '1003:1003'                     # same as Lyrion's PUID/PGID, so LMS can read the files
    ports:
      - '8080:8080'
    environment:
      TZ: 'Europe/Amsterdam'
      TRACK_SUBDIR: ''                    # e.g. 'RPM' to only scan /music/RPM
      LMS_URL: 'http://lyrion-app:9000'
    volumes:
      - lyrionmediamount:/music:ro
      - ./playlist:/playlist
      - ./rpm-data:/data                  # stores the class structure
