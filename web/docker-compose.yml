# Standalone compose file for the RPM playlist generator.
# Runs next to (not inside) the Lyrion compose project.
services:
  rpm-playlists:
    image: 'ghcr.io/tabnul/rpm-mp3-playlist-generator:latest'
    restart: unless-stopped
    user: '1003:1003'                     # same as Lyrion's PUID/PGID
    ports:
      - '8080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      TZ: 'Europe/Amsterdam'
      TRACK_SUBDIR: ''                    # e.g. 'RPM' to only scan /music/RPM
      LMS_URL: 'http://host.docker.internal:9000'   # Lyrion via its published port
    volumes:
      # Mount at /music: the same path Lyrion uses, so playlist entries resolve in LMS.
      - /path/to/music:/music:ro
      - /path/to/lyrion/playlist:/playlist   # Lyrion's ./playlist folder
      - ./data:/data                         # stores the class structure
